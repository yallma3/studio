name: Release

on:
  push:
    tags:
      - '*'

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_valid: ${{ steps.version.outputs.is_valid }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Tag $TAG does not match version pattern (e.g., v1.0.0)"
            echo "is_valid=false" >> $GITHUB_OUTPUT
            echo "version=$TAG" >> $GITHUB_OUTPUT
            exit 0
          fi
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_valid=true" >> $GITHUB_OUTPUT

  build-macos:
    needs: get-version
    if: needs.get-version.outputs.is_valid == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Update version in tauri.conf.json
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); p.version = '${{ needs.get-version.outputs.version }}'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2) + '\n');"

      - name: Build for Intel (x86_64)
        run: yarn tauri-build --target x86_64-apple-darwin

      - name: Rename Intel DMG
        run: |
          mkdir -p release
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg release/yaLLMa3_Studio_Intel.dmg

      - name: Build for Apple Silicon (aarch64)
        run: yarn tauri-build --target aarch64-apple-darwin

      - name: Rename ARM DMG
        run: |
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release/yaLLMa3_Studio_AppleSilicon.dmg

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg

  build-linux:
    needs: get-version
    if: needs.get-version.outputs.is_valid == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Update version in tauri.conf.json
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); p.version = '${{ needs.get-version.outputs.version }}'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2) + '\n');"

      - name: Build
        run: yarn tauri-build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: src-tauri/target/release/bundle/**/*

  build-windows:
    needs: get-version
    if: needs.get-version.outputs.is_valid == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Update version in tauri.conf.json
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); p.version = '${{ needs.get-version.outputs.version }}'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2) + '\n');"

      - name: Build
        run: yarn tauri-build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: src-tauri/target/release/bundle/**/*

  release:
    needs: [get-version, build-macos, build-linux, build-windows]
    if: needs.get-version.outputs.is_valid == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-b') || contains(github.ref, '-a') }}
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
